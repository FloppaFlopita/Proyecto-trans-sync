global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'eureka-server'
    metrics_path: '/actuator/eureka/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'ms-rutas'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8101']

  - job_name: 'ms-flota'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8102']

  - job_name: 'ms-reservas'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8103']

  - job_name: 'ms-pagos'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8104']

  - job_name: 'ms-promociones'
    metrics_path: '/actuator/promociones/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'ms-fidelizacion'
    metrics_path: '/actuator/fidelizacion/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'ms-auth'
    metrics_path: '/actuator/auth/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'ms-facturacion'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8108']
