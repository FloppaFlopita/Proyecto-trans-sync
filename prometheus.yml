global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']

  - job_name: 'ms-rutas'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8101']

  - job_name: 'ms-flota'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8102']

  - job_name: 'ms-reservas'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8103']

  - job_name: 'ms-pagos'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8104']
