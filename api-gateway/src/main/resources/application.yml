server:
  port: 8100

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: ms-auth
          uri: http://localhost:8107
          predicates:
            - Path=/api/auth/**

        - id: ms-rutas
          uri: http://localhost:8101
          predicates:
            - Path=/api/rutas/**
          filters:
            - StripPrefix=1

        - id: ms-flota
          uri: http://localhost:8102
          predicates:
            - Path=/api/buses/**
          filters:
            - StripPrefix=1

        - id: ms-reservas
          uri: http://localhost:8103
          predicates:
            - Path=/api/reservas/**
          filters:
            - StripPrefix=1

        - id: ms-pagos
          uri: http://localhost:8104
          predicates:
            - Path=/api/pagos/**
          filters:
            - StripPrefix=1

        - id: ms-promociones
          uri: http://localhost:8105
          predicates:
            - Path=/api/promociones/**

        - id: ms-fidelizacion
          uri: http://localhost:8106
          predicates:
            - Path=/api/fidelizacion/**

        - id: ms-facturacion
          uri: http://localhost:8108
          predicates:
            - Path=/api/facturacion/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
