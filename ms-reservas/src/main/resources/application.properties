server.port=8103
spring.application.name=ms-reservas

spring.datasource.url=jdbc:postgresql://localhost:8543/trans_sync_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true

# S6: Resiliencia - Resilience4j & Feign Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
feign.circuitbreaker.enabled=true

resilience4j.timelimiter.instances.FlotaClient.timeout-duration=2s
resilience4j.circuitbreaker.instances.FlotaClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.FlotaClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.FlotaClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.FlotaClient.wait-duration-in-open-state=5s

# S8: Kafka Producer Config
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=1500
